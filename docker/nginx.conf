# nginx configuration for the Buddhi Labs static website (container-internal, port 80).
# TLS termination, HSTS and the www/non-www redirect are handled by the reverse proxy (docker-compose.prod.yml → Caddy)
# or by the hosting platform. See docs/deployment-checklist.md and docs/security-checklist.md.

map $sent_http_content_type $cache_policy {
    default                     "public, max-age=600, must-revalidate";   # HTML and anything unlisted: 10 minutes
    ~image/                     "public, max-age=2592000, immutable";    # 30 days
    ~font/                      "public, max-age=31536000, immutable";   # 1 year
    text/css                    "public, max-age=2592000";              # 30 days (bump the filename/query on release)
    application/javascript      "public, max-age=2592000";
    application/xml             "public, max-age=3600";                  # sitemap
    text/plain                  "public, max-age=3600";                  # robots.txt
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;

    # ---------- Security headers (see docs/security-checklist.md for the allow-list rationale) ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    # Content-Security-Policy – allows: self, Google Fonts, Google Analytics/Tag Manager, Microsoft Clarity,
    # Meta Pixel, reCAPTCHA, Formspree, Google Maps embed. Remove sources you do not use; add your API origin if
    # the backend lives on another host (connect-src).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://formspree.io; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://connect.facebook.net https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://www.google-analytics.com https://www.googletagmanager.com https://www.facebook.com https://*.clarity.ms https://c.clarity.ms; connect-src 'self' https://formspree.io https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://*.clarity.ms https://c.clarity.ms https://www.facebook.com https://www.google.com; frame-src 'self' https://www.google.com https://maps.google.com https://www.googletagmanager.com; upgrade-insecure-requests" always;
    # Strict-Transport-Security is set by the TLS-terminating proxy only when HTTPS is active (see docker-compose.prod.yml).

    add_header Cache-Control $cache_policy always;

    # Clean URLs: /products -> /products.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Never serve internal/reference files even if they end up in the image
    location ~ ^/(reference|scripts|node_modules|backend|docs)/ { return 404; }
    location ~ /\.(?!well-known) { return 404; }          # dotfiles (.env, .git)
    location ~* \.(md|yml|yaml|json|lock|sh|py|mjs)$ { return 404; }   # source/config files (site.webmanifest not used)

    # Custom 404 page (short cache)
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; }

    # Health endpoint for the container
    location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

    # OPTIONAL: proxy the contact API to the Node backend (docker-compose.prod.yml enables this via env)
    # location /api/ {
    #     proxy_pass http://api:3000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
